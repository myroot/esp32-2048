[env:esp32-4848S040]
platform = espressif32
board = esp32s3box
framework = arduino

; Serial Monitor & Upload configuration
upload_port = /dev/cu.usbserial-10
upload_speed = 115200
monitor_port = /dev/cu.usbserial-10
monitor_speed = 115200

; Board Memory & Flash configuration
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = opi

; CPU & Build Flags
build_flags = 
    -D BOARD_HAS_PSRAM
    -D LV_CONF_SKIP
    -D CORE_DEBUG_LEVEL=2


; Popular Libraries for ESP32-4848S040 Display & Touch
lib_deps = 
    lovyan03/LovyanGFX @ ^1.2.0
    lvgl/lvgl @ ^8.3.11
